name: Local verification checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-checks.yml'
      - 'requirements-checks.txt'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/local-checks.yml'
      - 'requirements-checks.txt'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-checks.txt
      - run: python -m pip check
      - run: python -m ruff check scripts tests
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -p 'test_verify*.py' -v
