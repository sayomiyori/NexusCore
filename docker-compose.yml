networks:
  nexus_net:
    driver: bridge
  # Opt-in Stage 1 network: Kafka/ZooKeeper/EventPipe PostgreSQL/SeaweedFS/
  # transform/query have no internet egress. Ingest and query also join
  # nexus_net because they call AuthFortress.
  observability_events_net:
    driver: bridge
    internal: true

volumes:
  nexus_postgres_data:
  nexus_redis_data:
  nexus_agent_uploads:
  nexus_eventpipe_postgres_data:
  nexus_eventpipe_seaweed_data:
  nexus_kafka_data:

# EventPipe database password is mounted as a Compose secret; the application
# services receive a ready DATABASE_URL from the operator environment instead of
# a user:password literal in this file.
secrets:
  eventpipe_db_password:
    environment: EVENTPIPE_DB_PASSWORD

# Shared container defaults: unbounded json-file logs can fill the host disk.
x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# API containers only serve HTTP; they never need a writable root filesystem or
# Linux capabilities. Workers and datastores are intentionally excluded.
x-api-hardening: &api_hardening
  read_only: true
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  pids_limit: 256

# Workers need no capabilities either, but they keep a writable root filesystem
# because Celery/bytecode/spool writes are not worth pinning down yet.
x-worker-hardening: &worker_hardening
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  pids_limit: 256
  security_opt: ["no-new-privileges:true"]

services:

  #ЕДИНАЯ ИНФРА
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: nexus-postgres
    restart: unless-stopped
    logging: *default_logging
    pids_limit: 512
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      WEBHOOK_DB_PASSWORD: ${WEBHOOK_DB_PASSWORD:?Set WEBHOOK_DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD}
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:25432:5432"
    networks:
      - nexus_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: nexus-redis
    restart: unless-stopped
    logging: *default_logging
    pids_limit: 128
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - nexus_redis_data:/data
    networks:
      - nexus_net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  #МИКРОСЕРВИС АВТОРИЗАЦИИ (AuthFortress)
  auth_service:
    build:
      context: ../AuthFortress
      dockerfile: Dockerfile
    container_name: nexus-auth
    restart: unless-stopped
    logging: *default_logging
    <<: *api_hardening
    security_opt: ["no-new-privileges:true"]
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://auth_service:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}@postgres:5432/authfortress
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
      JWT_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY}
      # Null passes through a configured key and omits it when absent.
      AUTHFORTRESS_WEBHOOK_SERVICE_KEY:
    ports:
      - "127.0.0.1:28080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - nexus_net


  #ШЛЮЗ ВЕБХУКОВ (WebHook_Manager)
  webhook_service:
    build:
      context: ../WebHook_Manager
      dockerfile: Dockerfile
    container_name: nexus-webhook-api
    restart: unless-stopped
    logging: *default_logging
    <<: *api_hardening
    security_opt: ["no-new-privileges:true"]
    command: sh -c "python -m alembic upgrade head && exec uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://webhook_service:${WEBHOOK_DB_PASSWORD:?Set WEBHOOK_DB_PASSWORD}@postgres:5432/webhook_manager
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY}
      PLATFORM_BOTS_ENABLED: ${PLATFORM_BOTS_ENABLED:-false}
      AUTHFORTRESS_BASE_URL: http://auth_service:8000
      BOT_CREDENTIALS_KEY: ${BOT_CREDENTIALS_KEY:-}
      AUTHFORTRESS_WEBHOOK_SERVICE_KEY: ${AUTHFORTRESS_WEBHOOK_SERVICE_KEY:-}
      WEBHOOK_AGENT_CONTEXT_KEY: ${WEBHOOK_AGENT_CONTEXT_KEY:-}
      CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      TRUSTED_HOSTS: '["127.0.0.1","localhost","webhook_service"]'
      RATE_LIMIT_BOT_REGISTER: ${RATE_LIMIT_BOT_REGISTER:-10}
      PLATFORM_TELEGRAM_ENABLED: ${PLATFORM_TELEGRAM_ENABLED:-false}
      TELEGRAM_WEBHOOK_ORIGIN: ${TELEGRAM_WEBHOOK_ORIGIN:-}
      AGENTHUB_BASE_URL: http://agent_service:8000
      WEBHOOK_AGENT_INGRESS_KEY: ${WEBHOOK_AGENT_INGRESS_KEY:-}
      PLATFORM_PUBLICATION_MAX_ATTEMPTS: ${PLATFORM_PUBLICATION_MAX_ATTEMPTS:-10}
      TELEGRAM_REPLIES_ENABLED: ${TELEGRAM_REPLIES_ENABLED:-false}
      AGENT_WEBHOOK_REPLY_KEY: ${AGENT_WEBHOOK_REPLY_KEY:-}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - nexus_net

  webhook_worker:
    build:
      context: ../WebHook_Manager
      dockerfile: Dockerfile
    container_name: nexus-webhook-worker
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: celery -A src.infrastructure.queue.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      webhook_service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://webhook_service:${WEBHOOK_DB_PASSWORD:?Set WEBHOOK_DB_PASSWORD}@postgres:5432/webhook_manager
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY}
      PLATFORM_BOTS_ENABLED: "false"
      PLATFORM_TELEGRAM_ENABLED: "false"
      AUTHFORTRESS_BASE_URL: http://auth_service:8000
      AUTHFORTRESS_WEBHOOK_SERVICE_KEY: ${AUTHFORTRESS_WEBHOOK_SERVICE_KEY:-}
      AGENTHUB_BASE_URL: http://agent_service:8000
      WEBHOOK_AGENT_INGRESS_KEY: ${WEBHOOK_AGENT_INGRESS_KEY:-}
      PLATFORM_PUBLICATION_MAX_ATTEMPTS: ${PLATFORM_PUBLICATION_MAX_ATTEMPTS:-10}
    networks:
      - nexus_net

  webhook_delivery_recovery:
    profiles: [legacy-recovery]
    build:
      context: ../WebHook_Manager
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: python -m scripts.recover_legacy_deliveries
    depends_on:
      webhook_service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://webhook_service:${WEBHOOK_DB_PASSWORD:?Set WEBHOOK_DB_PASSWORD}@postgres:5432/webhook_manager
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY}
      PLATFORM_BOTS_ENABLED: "false"
      PLATFORM_TELEGRAM_ENABLED: "false"
      TELEGRAM_REPLIES_ENABLED: "false"
    networks:
      - nexus_net

  webhook_outbox_recovery:
    profiles: [telegram-ingress, telegram-ai]
    build:
      context: ../WebHook_Manager
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: python -m scripts.recover_platform_outbox
    depends_on:
      webhook_service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://webhook_service:${WEBHOOK_DB_PASSWORD:?Set WEBHOOK_DB_PASSWORD}@postgres:5432/webhook_manager
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY}
      PLATFORM_BOTS_ENABLED: "false"
      PLATFORM_TELEGRAM_ENABLED: "false"
      AUTHFORTRESS_BASE_URL: http://auth_service:8000
      AUTHFORTRESS_WEBHOOK_SERVICE_KEY: ${AUTHFORTRESS_WEBHOOK_SERVICE_KEY:-}
      AGENTHUB_BASE_URL: http://agent_service:8000
      WEBHOOK_AGENT_INGRESS_KEY: ${WEBHOOK_AGENT_INGRESS_KEY:-}
      PLATFORM_PUBLICATION_MAX_ATTEMPTS: ${PLATFORM_PUBLICATION_MAX_ATTEMPTS:-10}
    networks:
      - nexus_net


  #ИИ-МОЗГ И RAG (AgentHub)
  agent_service:
    build:
      context: ../AgentHub
      dockerfile: Dockerfile
    container_name: nexus-agent-api
    restart: unless-stopped
    logging: *default_logging
    <<: *api_hardening
    security_opt: ["no-new-privileges:true"]
    # The integrated root must not run AgentHub's unauthenticated standalone API.
    command: sh -c "python /app/agent_platform_preflight.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &agent_platform_environment
      DATABASE_URL: postgresql+psycopg://agent_service:${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD}@postgres:5432/agenthub
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/3
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      TELEGRAM_AI_ENABLED: ${TELEGRAM_AI_ENABLED:-false}
      PLATFORM_READ_ENABLED: ${PLATFORM_READ_ENABLED:-false}
      PLATFORM_TENANT_ENABLED: ${PLATFORM_TENANT_ENABLED:-true}
      AUTHFORTRESS_BASE_URL: http://auth_service:8000
      TELEGRAM_AI_PROVIDER: groq
      TELEGRAM_AI_MODEL: ${TELEGRAM_AI_MODEL:-openai/gpt-oss-20b}
      WEBHOOK_AGENT_INGRESS_KEY: ${WEBHOOK_AGENT_INGRESS_KEY:-}
      WEBHOOK_INTERNAL_URL: http://webhook_service:8000
      WEBHOOK_AGENT_SERVICE_KEY: ${WEBHOOK_AGENT_CONTEXT_KEY:-}
      AGENT_WEBHOOK_REPLY_KEY: ${AGENT_WEBHOOK_REPLY_KEY:-}
    ports:
      - "127.0.0.1:8014:8000"
    healthcheck:
      test: ["CMD", "python", "/app/agent_platform_healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - nexus_agent_uploads:/app/uploads
      - ./scripts/agent_platform_preflight.py:/app/agent_platform_preflight.py:ro
      - ./scripts/agent_platform_healthcheck.py:/app/agent_platform_healthcheck.py:ro
    networks:
      - nexus_net

  agent_worker:
    build:
      context: ../AgentHub
      dockerfile: Dockerfile
    container_name: nexus-agent-worker
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: celery -A app.workers.embed_worker.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      agent_service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://agent_service:${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD}@postgres:5432/agenthub
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/3
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - nexus_agent_uploads:/app/uploads
    networks:
      - nexus_net

  agent_telegram_worker:
    profiles: [telegram-ai]
    build: &agent_platform_build
      context: ../AgentHub
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: celery -A app.workers.telegram_worker:celery_app worker --loglevel=info --concurrency=2 --queues=telegram_ai
    depends_on: &agent_platform_dependencies
      agent_service:
        condition: service_healthy
      webhook_service:
        condition: service_healthy
    environment: *agent_platform_environment
    networks: [nexus_net]

  agent_telegram_recovery:
    profiles: [telegram-ai]
    build: *agent_platform_build
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: python -m scripts.recover_telegram_jobs
    depends_on: *agent_platform_dependencies
    environment:
      <<: *agent_platform_environment
      GROQ_API_KEY: ""
    networks: [nexus_net]

  agent_reply_worker:
    profiles: [telegram-ai]
    build: *agent_platform_build
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: celery -A app.workers.telegram_reply_worker:celery_app worker --loglevel=info --concurrency=2 --queues=telegram_replies
    depends_on: *agent_platform_dependencies
    environment:
      <<: *agent_platform_environment
      GROQ_API_KEY: ""
    networks: [nexus_net]

  agent_reply_recovery:
    profiles: [telegram-ai]
    build: *agent_platform_build
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: python -m scripts.recover_telegram_replies
    depends_on: *agent_platform_dependencies
    environment:
      <<: *agent_platform_environment
      GROQ_API_KEY: ""
    networks: [nexus_net]

  webhook_sender:
    profiles: [telegram-ai]
    build: &webhook_sender_build
      context: ../WebHook_Manager
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: celery -A src.infrastructure.queue.celery_app:celery_app worker --loglevel=info --concurrency=2 --queues=telegram_send
    depends_on: &webhook_sender_dependencies
      webhook_service:
        condition: service_healthy
    environment: &webhook_sender_environment
      DATABASE_URL: postgresql+asyncpg://webhook_service:${WEBHOOK_DB_PASSWORD:?Set WEBHOOK_DB_PASSWORD}@postgres:5432/webhook_manager
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY}
      PLATFORM_BOTS_ENABLED: ${PLATFORM_BOTS_ENABLED:-false}
      PLATFORM_TELEGRAM_ENABLED: ${PLATFORM_TELEGRAM_ENABLED:-false}
      TELEGRAM_REPLIES_ENABLED: ${TELEGRAM_REPLIES_ENABLED:-false}
      AUTHFORTRESS_BASE_URL: http://auth_service:8000
      AUTHFORTRESS_WEBHOOK_SERVICE_KEY: ${AUTHFORTRESS_WEBHOOK_SERVICE_KEY:-}
      WEBHOOK_AGENT_CONTEXT_KEY: ${WEBHOOK_AGENT_CONTEXT_KEY:-}
      WEBHOOK_AGENT_INGRESS_KEY: ${WEBHOOK_AGENT_INGRESS_KEY:-}
      AGENT_WEBHOOK_REPLY_KEY: ${AGENT_WEBHOOK_REPLY_KEY:-}
      BOT_CREDENTIALS_KEY: ${BOT_CREDENTIALS_KEY:-}
      TELEGRAM_WEBHOOK_ORIGIN: ${TELEGRAM_WEBHOOK_ORIGIN:-}
      AGENTHUB_BASE_URL: http://agent_service:8000
    networks: [nexus_net]

  webhook_send_recovery:
    profiles: [telegram-ai]
    build: *webhook_sender_build
    restart: unless-stopped
    logging: *default_logging
    <<: *worker_hardening
    command: python -m scripts.recover_telegram_answers
    depends_on: *webhook_sender_dependencies
    environment: *webhook_sender_environment
    networks: [nexus_net]

  # --- observability-events profile (Stage 1, opt-in) ---------------------
  # Never started by a plain `docker compose up`. EventPipe keeps its own
  # PostgreSQL, Kafka/ZooKeeper and SeaweedFS; the root stack is not reused.
  zookeeper:
    profiles: [observability-events]
    image: confluentinc/cp-zookeeper:7.5.0@sha256:02f6c042bb9a7844382fc4cedc513a44585d8a5acae873fb9e510e3ca9dcabc6
    restart: unless-stopped
    logging: *default_logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [observability_events_net]
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181 30"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka:
    profiles: [observability-events]
    image: confluentinc/cp-kafka:7.5.0@sha256:fbbb6fa11b258a88b83f54d4f0bddfcffbf2279f99d66a843486e3da7bdfbf41
    restart: unless-stopped
    logging: *default_logging
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - nexus_kafka_data:/var/lib/kafka/data
    networks: [observability_events_net]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka_init:
    profiles: [observability-events]
    image: confluentinc/cp-kafka:7.5.0@sha256:fbbb6fa11b258a88b83f54d4f0bddfcffbf2279f99d66a843486e3da7bdfbf41
    restart: "no"
    logging: *default_logging
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
          --topic events.raw --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
          --topic events.dlq --partitions 1 --replication-factor 1
    networks: [observability_events_net]

  eventpipe_postgres:
    profiles: [observability-events]
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    logging: *default_logging
    environment:
      POSTGRES_USER: eventpipe
      POSTGRES_PASSWORD_FILE: /run/secrets/eventpipe_db_password
      POSTGRES_DB: eventpipe
    secrets:
      - eventpipe_db_password
    volumes:
      - nexus_eventpipe_postgres_data:/var/lib/postgresql/data
    networks: [observability_events_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpipe -d eventpipe"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweedfs:
    profiles: [observability-events]
    image: chrislusf/seaweedfs:3.75@sha256:52d4955fa82e9edd426bf5d73467dfe5ad441ffa9c39aa31e96e1c2988e72755
    restart: unless-stopped
    logging: *default_logging
    command: server -dir=/data -s3 -filer -ip=seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-}
    volumes:
      - nexus_eventpipe_seaweed_data:/data
    networks: [observability_events_net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  seaweedfs_init:
    profiles: [observability-events]
    image: python:3.11-alpine@sha256:7fbad8e4652eae0186429a6f26cf5b23e27e8c6fd7ac4d0cfd7a6988cdeea1e1
    restart: "no"
    logging: *default_logging
    depends_on:
      seaweedfs:
        condition: service_healthy
    # Bucket creation pulls boto3, so this one-shot joins the egress-capable
    # application network; it exits before the applications start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install boto3 --quiet
        python -c "
        import boto3, time, urllib.request
        while True:
            try:
                urllib.request.urlopen('http://seaweedfs:8333')
                break
            except Exception:
                time.sleep(2)
        s3 = boto3.client('s3', endpoint_url='http://seaweedfs:8333', aws_access_key_id='${SEAWEEDFS_ACCESS_KEY}', aws_secret_access_key='${SEAWEEDFS_SECRET_KEY}', region_name='us-east-1')
        try:
            s3.create_bucket(Bucket='raw-events')
        except Exception:
            pass
        "
    networks: [nexus_net, observability_events_net]

  eventpipe_migrate:
    profiles: [observability-events]
    build:
      context: ../EventPipe
      dockerfile: transform_service/Dockerfile
    restart: "no"
    logging: *default_logging
    command: ["alembic", "upgrade", "head"]
    environment:
      TRANSFORM_DATABASE_URL: ${EVENTPIPE_DATABASE_URL:-}
      TRANSFORM_PLATFORM_MODE: "true"
    depends_on:
      eventpipe_postgres:
        condition: service_healthy
